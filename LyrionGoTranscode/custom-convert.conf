# Transcodierregeln für LyrionGo (Android) – automatisch erzeugt.
#
# LyrionGo meldet sich je nach Einstellung mit einem dieser Modellnamen:
#   LyrionGo        Original (FLAC), keine Umwandlung
#   LyrionGoQ6      FLAC -> Ogg Vorbis Stufe 6  (~192 kbps)
#   LyrionGoQ8      FLAC -> Ogg Vorbis Stufe 8  (~256 kbps)
#   LyrionGoQ10     FLAC -> Ogg Vorbis Stufe 10 (~450-500 kbps)
#   ...M            zusätzlich MP3 -> Ogg Vorbis (nur Stufe 6 und 8)
#
# Downloads (ohne Player) nutzen private Typen aus custom-types.conf:
#   lg6 / lg8 / lgx = Ogg Vorbis Stufe 6 / 8 / 10
#   op96 / op128 / op160 / op192 = Opus mit 96 / 128 / 160 / 192 kbps
#
# Wird vom LMS-Plugin "LyrionGo Transcode" mitgeliefert. Alternativ (ohne Plugin): diese Datei und custom-types.conf in den LMS-Einstellungsordner
# (LMS > Einstellungen > Information > Einstellungsordner), dann LMS neu starten.
# Gibt es dort schon Dateien gleichen Namens, den Inhalt anhängen.
# Aufbau der Regeln wie beim Plugin MobileTranscode (FT für Dateien, IT für Durchgereichtes).

# ---- LyrionGoQ6 ----
flc ogg LyrionGoQ6 *
	# FT:{START=--skip=%t}U:{END=--until=%v}D:{RESAMPLE=-r %d}
	[flac] -dcs $START$ $END$ --force-raw-format --sign=signed --endian=little -- $FILE$ | [sox] -q -t raw --encoding signed-integer -b $SAMPLESIZE$ -r $SAMPLERATE$ -c $CHANNELS$ -L - -t ogg $RESAMPLE$ -C 6 -

flc ogg LyrionGoQ6 *
	# IT:{START=--skip=%t}U:{END=--until=%v}D:{RESAMPLE=-r %d}E:{NOSTART=I}
	[flac] -dcs $START$ $END$ --force-raw-format --sign=signed --endian=little -- $FILE$ | [sox] -q -t raw --encoding signed-integer -b $SAMPLESIZE$ -r $SAMPLERATE$ -c $CHANNELS$ -L - -t ogg $RESAMPLE$ -C 6 -

ogf ogg LyrionGoQ6 *
	# IFD:{RESAMPLE=-r %d}
	[flac] --ogg -dcs -- $FILE$ | [sox] -q -t wav --ignore-length - -t ogg $RESAMPLE$ -C 6 -

# ---- LyrionGoQ6M ----
flc ogg LyrionGoQ6M *
	# FT:{START=--skip=%t}U:{END=--until=%v}D:{RESAMPLE=-r %d}
