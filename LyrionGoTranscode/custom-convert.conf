	[flac] --ogg -dcs -- $FILE$ | [ffmpeg] -hide_banner -loglevel error -f wav -i - -c:a libopus -b:a 192k -vbr on -ar 48000 -f ogg -

mp3 ops LyrionGoO192M192 *
	# FT:{START=-ss %s}
	[ffmpeg] -hide_banner -loglevel error $START$ -i $FILE$ -map 0:a -c:a libopus -b:a 192k -vbr on -ar 48000 -f ogg -

# ---- Downloads ----
flc lg6 * *
	# F:{START=--skip=%t}U:{END=--until=%v}
	[flac] -dcs $START$ $END$ --force-raw-format --sign=signed --endian=little -- $FILE$ | [sox] -q -t raw --encoding signed-integer -b $SAMPLESIZE$ -r $SAMPLERATE$ -c $CHANNELS$ -L - -t ogg -C 6 -

mp3 lg6 * *
	# F
	[lame] --decode --silent $FILE$ - | [sox] -q -t wav --ignore-length - -t ogg -C 6 -

