# ============================================================
# Opus (benötigt ffmpeg mit libopus, z. B. piCorePlayer: Erweiterung ffmpeg7.tcz)
#   LyrionGoO<kbps>            FLAC -> Opus mit <kbps>
#   LyrionGoO<kbps>M<kbps2>    zusätzlich MP3 -> Opus mit <kbps2>
