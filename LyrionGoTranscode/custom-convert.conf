# ---- LyrionGoO96 ----
flc ops LyrionGoO96 *
	# FT:{START=--skip=%t}U:{END=--until=%v}
	[flac] -dcs $START$ $END$ -- $FILE$ | [ffmpeg] -hide_banner -loglevel error -f wav -i - -c:a libopus -b:a 96k -vbr on -ar 48000 -f ogg -

