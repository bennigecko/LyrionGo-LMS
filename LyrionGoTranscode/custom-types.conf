# Private Download-Typen für LyrionGo:
#   lg6 / lg8 / lgx = Ogg Vorbis Stufe 6 / 8 / 10, op96 … op192 = Opus mit 96 … 192 kbps.
# Kein Player bietet sie an, sie ändern also keinen Stream – nur
# /music/<id>/download.<typ> fragt sie an.
#ID     Suffix          Mime Content-Type               Server File Type
lg6     lg6             audio/ogg                       audio
lg8     lg8             audio/ogg                       audio
lgx     lgx             audio/ogg                       audio
op96    op96            audio/ogg                       audio
op128   op128           audio/ogg                       audio
op160   op160           audio/ogg                       audio
op192   op192           audio/ogg                       audio
